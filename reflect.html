<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nur für dich zum Nachdenken</title>
<style>
  :root{
    --bg:#FBF6F0; --card:#FFFFFF; --ink:#3A322E; --muted:#8A7E76;
    --clay:#C2826A; --clay-dark:#A86A53; --sage:#8FA68E;
    --line:#ECE3D9; --soft:#F4ECE3;
    --shadow:0 8px 30px rgba(120,90,70,.10);
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:22px 18px 90px}
  .backlink{display:inline-block;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:6px}
  .backlink:hover{color:var(--clay)}
  .progress{display:flex;gap:7px;justify-content:center;margin:12px 0 24px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.2s}
  .dot.done{background:var(--sage)}
  .dot.cur{background:var(--clay);transform:scale(1.35)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px 28px;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sec-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--clay);font-weight:700}
  h1{font-family:var(--serif);font-weight:600;font-size:29px;margin:6px 0 2px;letter-spacing:-.01em;line-height:1.2}
  .lead{color:var(--muted);font-size:16px;margin:4px 0 0}

  .ack{background:#FBF0F3;border:1px solid #EAC9D2;border-radius:16px;padding:18px 20px;margin-top:18px;font-size:15px;line-height:1.7;color:#7a4f5b}
  .ack b{color:#5f3c46}
  .privacy{background:#EEF3EC;border:1px solid #DCE7DB;color:#5e7a5c;font-size:13.5px;border-radius:14px;padding:14px 16px;margin-top:16px;line-height:1.6}
  .privacy ul{margin:6px 0 0;padding-left:18px}
  .privacy li{margin:3px 0}

  .q{margin-top:22px}
  .q label{display:block;font-size:16px;font-weight:600;margin-bottom:8px}
  .q .hint{font-weight:400;color:var(--muted);font-size:14px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-family:var(--sans);font-size:15px;line-height:1.55;color:var(--ink);background:#FFFDFB;resize:vertical;min-height:80px;transition:.15s}
  textarea:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px rgba(194,130,106,.12)}
  textarea.small{min-height:62px}

  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px}
  .btn{border:none;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:15px;border-radius:12px;padding:12px 22px;transition:.15s}
  .btn.primary{background:var(--clay);color:#fff}
  .btn.primary:hover{background:var(--clay-dark)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--ink)}
  .btn.danger{background:transparent;color:#c98}
  .saved{font-size:12px;color:var(--sage);text-align:center;margin-top:14px;height:16px;opacity:0;transition:.2s}
  .saved.show{opacity:1}

  .summary-q{margin-bottom:18px}
  .summary-q .ql{font-weight:600;font-size:15px;color:var(--clay-dark)}
  .summary-q .qa{font-size:15px;white-space:pre-wrap;margin-top:4px}
  .summary-q .qa.blank{color:#c3b8ad;font-style:italic}
  .summary-sec{font-family:var(--serif);font-size:21px;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--soft)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  @media print{.backlink,.progress,.nav,.toolbar,.privacy,.ack{display:none}.card{box-shadow:none;border:none}}
  @media(max-width:560px){.card{padding:24px 18px}h1{font-size:25px}.twocol{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="index.html">&larr; zurück</a>
  <div class="progress" id="progress"></div>
  <div id="stage"></div>
  <div class="saved" id="saved">gespeichert 🤍</div>
</div>

<script>
/* Neutral by design. The anti-bias prompts deliberately make LEAVING feel as
   legitimate as staying. Samuel names his conflict of interest first. */
const SECTIONS=[
  { intro:true, kicker:'Bevor du anfängst', title:'Nur für dich zum Nachdenken' },
  { kicker:'Teil 1 von 5', title:'Wo du gerade stehst', lead:'Kein Druck, keine richtige Antwort. Einfach ankommen.',
    qs:[
      {id:'real-decision', label:'Was ist die echte Entscheidung, vor der du gerade stehst?', hint:'In einem Satz, in deinen eigenen Worten, nicht wie andere es nennen.'},
      {id:'why-today', label:'Was hat dich heute hierher gebracht? Welches Gefühl?'},
    ]},
  { kicker:'Teil 2 von 5', title:'Der ehrliche Reiz beider Wege', lead:'Ganz symmetrisch. Keiner der beiden Wege ist hier der "richtige".',
    qs:[
      {id:'cozy-gives', label:'Bei Cozy zu bleiben gibt mir …', small:true},
      {id:'cozy-costs', label:'… und kostet mich …', small:true},
      {id:'own-gives', label:'Voll mein eigenes Ding zu machen gibt mir …', small:true},
      {id:'own-costs', label:'… und kostet mich …', small:true},
      {id:'faster-list', label:'Welche Liste hast du schneller geschrieben? Welche hattest du Angst, zu Ende zu schreiben?'},
    ]},
  { kicker:'Teil 3 von 5', title:'Die Fäden entwirren', lead:'Diese hier sind absichtlich so gestellt, dass Gehen genauso erlaubt ist wie Bleiben.',
    qs:[
      {id:'leave-works', label:'Stell dir vor, es sind 18 Monate vergangen, du bist voll dein eigenes Ding gegangen, und es läuft. Beschreib diesen Tag. Wie fühlt sich der Morgen an?'},
      {id:'friend', label:'Was würdest du einer guten Freundin in genau deiner Lage raten, wenn du nur IHR Bestes wolltest, nicht das von irgendwem drumherum?'},
      {id:'cozy-vs-samuel', label:'Was gibt dir Cozy, das nichts mit Samuel zu tun hat? Und wie viel von "ich sollte bleiben" ist eigentlich die Arbeit, und wie viel ist, die Beziehung nicht durcheinanderzubringen?'},
      {id:'samuel-fine', label:'Wenn du wüsstest, dass Samuel auf jeden Fall okay und stolz wäre, egal wie du dich entscheidest: ändert sich deine Antwort?', hint:'Wenn ja, ist diese Lücke es wert, genau hinzuschauen.'},
      {id:'only-you', label:'Was an dieser Entscheidung geht nur dich an, getrennt von jeder Beziehung oder Firma?'},
    ]},
  { kicker:'Teil 4 von 5', title:'Kleine Experimente', lead:'Du musst dich nicht entscheiden. Du kannst testen. Das nimmt allen Druck raus.',
    qs:[
      {id:'experiment', label:'Wähl eins, das du in den nächsten zwei Wochen ausprobieren könntest:', hint:'(a) Ein 2-Wochen-Creator-Sprint, behandelt wie der echte Job. (b) Drei normale Cozy-Tage, jeden Abend 1-10 bewerten: "hat sich das nach meinem angefühlt?" (c) Sprich mit einer Person, die voll vom eigenen Content lebt, und einer, die einen Job verlassen hat, der sie definiert hat.'},
      {id:'real-signal', label:'Was würde dir nach dem Experiment etwas Echtes sagen, nicht nur "aufregend" oder "beängstigend"?'},
    ]},
  { kicker:'Teil 5 von 5', title:'Zum Abschluss', lead:'',
    qs:[
      {id:'know-now', label:'Was weißt du jetzt, das du vor einer Stunde noch nicht wusstest?'},
      {id:'gut', label:'Wenn dein Bauch jetzt sprechen dürfte, auch wenn dein Kopf noch streitet: was sagt er?'},
    ]},
];

const KEY='hellen_reflect_v2';
let answers=JSON.parse(localStorage.getItem(KEY)||'{}');
let step=answers.__step||0;
function saveAns(){answers.__step=step;localStorage.setItem(KEY,JSON.stringify(answers));flash();}
let st;function flash(){const s=document.getElementById('saved');s.classList.add('show');clearTimeout(st);st=setTimeout(()=>s.classList.remove('show'),1100);}
const TOTAL=SECTIONS.length;

function renderProgress(){const p=document.getElementById('progress');p.innerHTML='';for(let i=0;i<=TOTAL;i++){const d=document.createElement('div');d.className='dot'+(i<step?' done':'')+(i===step?' cur':'');p.appendChild(d);}}

function renderStep(){
  renderProgress();
  const stage=document.getElementById('stage');
  if(step===TOTAL)return renderSummary();
  const sec=SECTIONS[step];
  if(sec.intro){
    stage.innerHTML=`<div class="card">
      <div class="sec-kicker">${sec.kicker}</div>
      <h1>${sec.title}</h1>
      <!-- SAMUEL: this acknowledgment is the trust core of this tool. The
           council was unanimous it must stay and be in your voice. Edit it,
           but keep: you name your conflict of interest, and you explicitly
           bless her choosing against you/Cozy. -->
      <div class="ack">
        <b>Hellen, bevor du anfängst, ein ehrliches Wort von mir:</b><br>
        Ich habe das hier gebaut, und ich bin nicht neutral. Ich bin dein Partner, und ich hänge mit Cozy zusammen, also will ein Teil von mir natürlich, dass du in der Nähe von beidem bleibst. Und ich habe dich gerade enttäuscht, also habe ich erst recht kein Recht, dich hier in irgendeine Richtung zu schubsen. Deshalb sage ich es deutlich: Cozy zu verlassen, dein eigenes Ding voll durchzuziehen, oder einen Weg zu wählen, der dich von allem Bisherigen wegführt, das sind alles vollkommen gute Antworten, und keine davon wäre ein Verrat an mir. Wenn sich dieses Tool jemals anfühlt, als würde es dich schubsen, ignorier es und vertrau dir selbst.
      </div>
      <div class="privacy">
        <b>🔒 Das hier gehört dir, ganz allein:</b>
        <ul>
          <li>Alles läuft nur in deinem Browser, auf diesem Gerät.</li>
          <li>Kein Konto, kein Server, keine Datenbank, kein Tracking.</li>
          <li>Niemand sieht das, auch ich nicht, jetzt nicht und nie.</li>
          <li>Du kannst es als PDF für dich speichern oder mit einem Klick komplett löschen.</li>
        </ul>
      </div>
      <div class="nav"><span></span><button class="btn primary" id="next">Anfangen &rarr;</button></div>
    </div>`;
  } else {
    const isTwo = sec.qs.every(q=>q.small);
    stage.innerHTML=`<div class="card">
      <div class="sec-kicker">${sec.kicker}</div>
      <h1>${sec.title}</h1>
      ${sec.lead?`<p class="lead">${sec.lead}</p>`:''}
      <div class="${isTwo?'twocol':''}">
      ${sec.qs.map(q=>`<div class="q">
        <label for="${q.id}">${q.label}${q.hint?`<br><span class="hint">${q.hint}</span>`:''}</label>
        <textarea id="${q.id}" data-id="${q.id}" class="${q.small?'small':''}" placeholder="Lass dir Zeit …">${esc(answers[q.id]||'')}</textarea>
      </div>`).join('')}
      </div>
      <div class="nav">
        <button class="btn ghost" id="prev">&larr; zurück</button>
        <button class="btn primary" id="next">${step===TOTAL-1?'Meine Gedanken ansehen':'Weiter'} &rarr;</button>
      </div>
    </div>`;
    stage.querySelectorAll('textarea').forEach(t=>t.addEventListener('input',()=>{answers[t.dataset.id]=t.value;saveAns();}));
  }
  wire();window.scrollTo({top:0,behavior:'smooth'});
}

function renderSummary(){
  const stage=document.getElementById('stage');
  let html=`<div class="card">
    <div class="sec-kicker">Deine Gedanken</div>
    <h1>Alles, was du gerade durchdacht hast</h1>
    <p class="lead">Keine Schlussfolgerung nötig. Manchmal reicht es, alles an einem Ort zu sehen, damit die Antwort von selbst auftaucht. Komm jederzeit wieder, es ist gespeichert.</p>`;
  SECTIONS.forEach(sec=>{
    if(sec.intro)return;
    html+=`<div class="summary-sec">${sec.title}</div>`;
    sec.qs.forEach(q=>{const a=(answers[q.id]||'').trim();
      html+=`<div class="summary-q"><div class="ql">${q.label}</div><div class="qa ${a?'':'blank'}">${a?esc(a):'(leer gelassen)'}</div></div>`;});
  });
  html+=`<div class="ack" style="background:#EEF3EC;border-color:#DCE7DB;color:#5e7a5c">
      Es ist völlig okay, wenn deine Antwort gerade ist: <b>"Ich weiß es noch nicht."</b> Das ist kein Scheitern, das ist Ehrlichkeit, und Ehrlichkeit ist genau das, was dir am wichtigsten ist. Du schuldest niemandem eine Entscheidung heute, auch Samuel nicht.
    </div>
    <div class="toolbar">
      <button class="btn primary" id="print">Als PDF speichern</button>
      <button class="btn ghost" id="copy">Als Text kopieren</button>
      <button class="btn ghost" id="prev">&larr; zurück</button>
      <button class="btn danger" id="erase">Alles löschen</button>
    </div></div>`;
  stage.innerHTML=html;
  document.getElementById('print').onclick=()=>window.print();
  document.getElementById('copy').onclick=copyAll;
  document.getElementById('prev').onclick=()=>{step--;saveAns();renderStep();};
  document.getElementById('erase').onclick=()=>{if(confirm('Wirklich alles löschen? Das kann nicht rückgängig gemacht werden.')){localStorage.removeItem(KEY);answers={};step=0;renderStep();}};
  renderProgress();window.scrollTo({top:0,behavior:'smooth'});
}

function copyAll(){
  let lines=['Meine Gedanken\n'];
  SECTIONS.forEach(sec=>{if(sec.intro)return;lines.push('\n— '+sec.title+' —');sec.qs.forEach(q=>{lines.push('\n'+q.label);lines.push((answers[q.id]||'').trim()||'(leer gelassen)');});});
  navigator.clipboard.writeText(lines.join('\n')).then(()=>{const b=document.getElementById('copy');const o=b.textContent;b.textContent='Kopiert 🤍';setTimeout(()=>b.textContent=o,1400);});
}
function wire(){const n=document.getElementById('next'),p=document.getElementById('prev');if(n)n.onclick=()=>{step++;saveAns();renderStep();};if(p)p.onclick=()=>{step--;saveAns();renderStep();};}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
renderStep();
</script>
</body>
</html>
