<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bis ich wieder bei dir bin</title>
<style>
  :root{
    --ink:#fff; --soft:rgba(255,255,255,.86); --faint:rgba(255,255,255,.6);
    --card:rgba(255,255,255,.12); --line:rgba(255,255,255,.22);
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:var(--sans);color:var(--ink);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
       transition:background 1.5s ease;background:linear-gradient(160deg,#caa3b0,#7c6a8f 55%,#3c3550)}
  /* time-of-day skins */
  body.morning{background:linear-gradient(160deg,#F6C9A8,#E79C9C 55%,#9E6F8E)}
  body.midday{background:linear-gradient(160deg,#A7C7E7,#8AA0C9 55%,#6E6FA0)}
  body.afternoon{background:linear-gradient(160deg,#F2B88C,#D98A8A 55%,#8E6A9A)}
  body.evening{background:linear-gradient(160deg,#E89B7C,#B5667F 50%,#5C4A77)}
  body.night{background:linear-gradient(170deg,#3a4a78,#2b2b52 55%,#171728)}

  .stars{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s}
  body.night .stars{opacity:1}
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .heart{position:absolute;bottom:-40px;font-size:18px;opacity:0;animation:float linear infinite}
  @keyframes float{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:.3}85%{opacity:.28}100%{transform:translateY(-108vh) scale(1);opacity:0}}

  .wrap{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:46px 22px 60px;text-align:center;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
  .greet{font-size:15px;letter-spacing:.04em;color:var(--soft);margin-bottom:6px}
  h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0 0 4px;line-height:1.2}
  .route{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--faint);margin:14px 0 26px}
  .routeline{position:relative;width:120px;height:2px;background:rgba(255,255,255,.3);border-radius:2px}
  .plane{position:absolute;top:-9px;font-size:16px;animation:fly 6s ease-in-out infinite}
  @keyframes fly{0%{left:-6px}100%{left:108px}}

  .clock{display:flex;justify-content:center;gap:10px;margin:6px 0 8px}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;min-width:74px;backdrop-filter:blur(6px)}
  .unit .n{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .unit .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:7px}
  .sleeps{font-size:15px;color:var(--soft);margin:14px 0 2px}
  .sleeps b{font-family:var(--serif);font-size:18px}
  .status{font-size:14.5px;color:var(--soft);margin-top:6px;min-height:18px;font-style:italic}

  .nudge{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin:26px auto 0;max-width:420px;backdrop-filter:blur(6px);animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .nudge .em{font-size:30px}
  .nudge .tx{font-size:17px;line-height:1.5;margin-top:8px}
  .more{margin-top:16px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-family:var(--sans);
        font-weight:600;font-size:14px;padding:11px 20px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
  .more:hover{background:rgba(255,255,255,.2)}
  .sign{margin-top:30px;font-family:var(--serif);font-style:italic;color:var(--soft);font-size:16px}

  /* arrived state */
  .arrived{display:none}
  body.done .countdown-block{display:none}
  body.done .arrived{display:block;animation:rise .6s ease both}
  .arrived h1{font-size:34px}
  @media(max-width:380px){.unit{min-width:64px;padding:12px 4px}.unit .n{font-size:32px}}
</style>
</head>
<body>
<canvas class="stars" id="stars"></canvas>
<div class="hearts" id="hearts"></div>

<div class="wrap">
  <div class="countdown-block">
    <div class="greet" id="greet">Hey du 🤍</div>
    <h1>Bis ich wieder bei dir bin</h1>
    <div class="route">
      <span>Guatemala</span>
      <span class="routeline"><span class="plane">✈️</span></span>
      <span>Amsterdam</span>
    </div>

    <div class="clock">
      <div class="unit"><div class="n" id="d">–</div><div class="l">Tage</div></div>
      <div class="unit"><div class="n" id="h">–</div><div class="l">Std</div></div>
      <div class="unit"><div class="n" id="m">–</div><div class="l">Min</div></div>
      <div class="unit"><div class="n" id="s">–</div><div class="l">Sek</div></div>
    </div>
    <div class="sleeps" id="sleeps"></div>
    <div class="status" id="status"></div>

    <div class="nudge" id="nudge">
      <div class="em" id="nEm">💧</div>
      <div class="tx" id="nTx">…</div>
    </div>
    <button class="more" id="more">noch ein kleiner Gedanke 🤍</button>

    <div class="sign">— unterwegs zu dir, S</div>
  </div>

  <div class="arrived">
    <h1>Ich bin gelandet. 🤍</h1>
  </div>
</div>

<script>
/* =========================================================================
   SAMUEL: set your REAL arrival here, in Amsterdam time (+02:00 im Sommer).
   Format: 'YYYY-MM-DDTHH:MM:00+02:00'. This is when you land / are with her.
   ========================================================================= */
const TARGET = new Date('2026-06-29T07:35:00+02:00');

/* time of day (HER time, Amsterdam), robust even if her phone travels */
function amsHour(){
  try{return (+new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',hour:'2-digit',hour12:false}).format(new Date()))%24;}
  catch(e){return new Date().getHours();}
}
function bucket(h){
  if(h>=5&&h<10)return'morning';
  if(h>=10&&h<14)return'midday';
  if(h>=14&&h<18)return'afternoon';
  if(h>=18&&h<22)return'evening';
  return'night';
}
const GREET={
  morning:'Guten Morgen, mein Lieblingsmensch 🤍',
  midday:'Hallo 🤍',
  afternoon:'Hallo 🤍',
  evening:'Guten Abend 🤍',
  night:'Gute Nacht 🌙',
};
/* time-aware reminder shown first (reminders FOR her, no promises) */
const CARE={
  morning:{em:'💧',tx:'Trink ein großes Glas Wasser, bevor der Tag startet.'},
  midday:{em:'🌿',tx:'Kurze Pause: ein paar Schritte an die frische Luft.'},
  afternoon:{em:'🚶‍♀️',tx:'Vielleicht ein kleiner Spaziergang? Tut dem Kopf gut.'},
  evening:{em:'🔥',tx:'Mach es dir gemütlich. Wärme tut gut, Schultern locker.'},
  night:{em:'🌙',tx:'Genug für heute. Schlaf gut.'},
};
/* gentle reminders for her, no promises, no words put in Samuel's mouth */
const NOTES=[
  {em:'💧',tx:'Schon genug getrunken heute? Hol dir ein Glas Wasser.'},
  {em:'🚶‍♀️',tx:'Zehn Minuten frische Luft können einen Tag drehen.'},
  {em:'🌬️',tx:'Einmal tief ein, langsam wieder aus. Nochmal.'},
  {em:'🔥',tx:'Wenn der Bauch zwickt: Wärme, ruhen, sanft zu dir sein.'},
  {em:'🍵',tx:'Mach dir was Warmes und setz dich kurz nur für dich hin.'},
  {em:'😴',tx:'Ausruhen ist nicht faul. Du darfst Pause machen.'},
  {em:'🌸',tx:'Iss heute etwas, das dir wirklich gut tut.'},
  {em:'🤍',tx:'Streck dich einmal richtig durch. Schultern runter.'},
  {em:'📿',tx:'Sei heute so sanft zu dir, wie du es zu anderen bist.'},
  /* SAMUEL: hier kannst du eigene, echte Zeilen in deinen Worten ergänzen. */
];

function setNudge(o){document.getElementById('nEm').textContent=o.em;document.getElementById('nTx').textContent=o.tx;
  const n=document.getElementById('nudge');n.style.animation='none';void n.offsetWidth;n.style.animation='rise .5s ease both';}

let noteIdx=0,order=[];
function reshuffle(){order=NOTES.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor((Date.now()/ (i+7))%(i+1));[order[i],order[j]]=[order[j],order[i]];}}
function nextNote(){if(noteIdx>=order.length){reshuffle();noteIdx=0;}setNudge(NOTES[order[noteIdx++]]);}

/* skin + greeting + first care nudge */
function applyTime(){
  const b=bucket(amsHour());
  document.body.className=b+(document.body.classList.contains('done')?' done':'');
  document.getElementById('greet').textContent=GREET[b];
  if(!started){setNudge(CARE[b]);started=true;}
}
let started=false;

/* countdown */
function amsDateStr(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Amsterdam',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function sleepsUntil(){
  const a=new Date(amsDateStr(new Date())+'T00:00:00');
  const b=new Date(amsDateStr(TARGET)+'T00:00:00');
  return Math.max(0,Math.round((b-a)/86400000));
}
function tick(){
  const now=new Date();let diff=TARGET-now;
  if(diff<=0){document.body.classList.add('done');return;}
  const d=Math.floor(diff/86400000);diff-=d*86400000;
  const h=Math.floor(diff/3600000);diff-=h*3600000;
  const m=Math.floor(diff/60000);diff-=m*60000;
  const s=Math.floor(diff/1000);
  document.getElementById('d').textContent=d;
  document.getElementById('h').textContent=String(h).padStart(2,'0');
  document.getElementById('m').textContent=String(m).padStart(2,'0');
  document.getElementById('s').textContent=String(s).padStart(2,'0');
  const sl=sleepsUntil();
  document.getElementById('sleeps').innerHTML=sl<=0?'Heute! 🤍':`noch <b>${sl}</b> mal schlafen`;
  const ms=TARGET-now;let st;
  if(ms<2*3600000)st='Fast gelandet.';
  else if(ms<24*3600000)st='Ankunft heute.';
  else if(ms<48*3600000)st='Ankunft morgen.';
  else st='';
  document.getElementById('status').textContent=st;
}

/* floating hearts */
function spawnHearts(){
  const box=document.getElementById('hearts');
  setInterval(()=>{
    if(document.hidden)return;
    const h=document.createElement('div');h.className='heart';
    h.textContent='🤍';
    h.style.left=(12+(Date.now()%76))+'%';
    h.style.fontSize='13px';
    h.style.animationDuration=(12+(Date.now()%5))+'s';
    box.appendChild(h);setTimeout(()=>h.remove(),18000);
  },7000);
}
/* stars for night */
function stars(){
  const c=document.getElementById('stars');const ctx=c.getContext('2d');
  function size(){c.width=innerWidth;c.height=innerHeight;}size();addEventListener('resize',size);
  const pts=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height*0.7,r:Math.random()*1.4+0.3,t:Math.random()*6}));
  (function draw(){ctx.clearRect(0,0,c.width,c.height);const now=Date.now()/600;
    pts.forEach(p=>{const a=0.4+0.6*Math.abs(Math.sin(now+p.t));ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();});
    requestAnimationFrame(draw);})();
}

document.getElementById('more').onclick=nextNote;

reshuffle();applyTime();tick();spawnHearts();stars();
setInterval(tick,1000);
setInterval(applyTime,60000);
/* gently auto-rotate the thought every 12s */
setInterval(()=>{if(!document.hidden)nextNote();},12000);
</script>
</body>
</html>
